n Appwrite Account Email Verification\n\n## Background\nAppwrite supports an email verification flow whereby a logged-in user can request a verification email containing a one-time secret. The application then redirects the user (via the URL provided to `createVerification`) to a route that calls `updateVerification(userId, secret)` to mark the user as verified.\n\nIn this task you implement the **user-facing first half** of that flow using the Appwrite Web SDK (`appwrite` npm package). An admin has already provisioned a user account in the project — your job is to log that user in and trigger the verification email by calling `account.createVerification`.\n\n## Requirements\n- Implement a Node.js CLI script at `/home/user/myproject/index.js`.\n- Read the seeded user's credentials from `/home/user/myproject/.seed.json` (keys `email`, `password`).\n- Read `APPWRITE_ENDPOINT` and `APPWRITE_PROJECT_ID` from the environment.\n- Use the **Appwrite Web SDK** (`appwrite`) — NOT the admin/server SDK — and configure a `Client` with `.setEndpoint(...).setProject(...)` only (do NOT call `.setKey(...)`).\n- **Step 1 — Login**: call `account.createEmailPasswordSession(email, password)` and capture the session.\n- **Step 2 — Fetch user**: call `account.get()` to obtain the current user's `$id`.\n- **Step 3 — Trigger verification**: call `account.createVerification('http://localhost:3000/verify')` to trigger the verification email/token.\n- **Step 4 — Output**: print `{\"userId\":\"\u003cid\u003e\",\"verificationUrl\":\"http://localhost:3000/verify\"}` as the last non-empty stdout line.\n- Exit code `0` on success.\n\n## Implementation Hints\n- `appwrite` (Web SDK) and `node-appwrite` (server SDK) are pre-installed under `/home/user/myproject/node_modules`.\n- Do not call `updateVerification` — only the first half of the flow is in scope; `emailVerification` will remain `false` until the email link is followed.\n- Log any debug messages to `stderr` to keep stdout clean.\n\n## Acceptance Criteria\n- Project path: `/home/user/myproject`.\n- Command: `node /home/user/myproject/index.js`.\n- Exit code: `0`.\n- Stdout: last non-empty line is a JSON object with exactly two keys: `userId` (matches the seeded user's `$id`) and `verificationUrl` (equals `http://localhost:3000/verify`).\n- The script must reference `createEmailPasswordSession` and `createVerification` and must NOT reference `setKey` on the client.\n"])</script><script>self.__next_f.push([1,"a:Te3c,"])</script><script>self.__next_f.push([1,"# Appwrite CLI: Initialize Project and Push a Collection\n\n## Background\nYour team wants to drive Appwrite resource setup from a shell pipeline so that every CI run can reproducibly create and tear down a database with a collection. You will use the Appwrite CLI (`appwrite-cli`, the official `appwrite` command) in non-interactive mode to authenticate against an Appwrite Cloud project, write a project configuration file declaring a database and a collection, and push the schema to Appwrite.\n\nThe CLI must be driven without any interactive prompts and without using the language SDKs directly to create resources.\n\n## Requirements\n- Place all your project files under `/home/user/myproject/`.\n- Write a runnable shell script `/home/user/myproject/run.sh` that, when executed with `bash`, performs the full workflow end-to-end.\n- Read `ZEALT_RUN_ID`, `APPWRITE_ENDPOINT`, `APPWRITE_PROJECT_ID`, and `APPWRITE_API_KEY` from the environment.\n- Use the Appwrite CLI (`appwrite`) — NOT the Appwrite SDK — to:\n  1. Switch the CLI to non-interactive mode using the project ID, endpoint, and API key.\n  2. Create / write an `appwrite.config.json` (or equivalent multi-file Appwrite project config) that declares:\n     - a database with id `cli-${ZEALT_RUN_ID}` and name `cli-${ZEALT_RUN_ID}` (or any human-readable name).\n     - a single collection / table inside that database with id `notes-${ZEALT_RUN_ID}` and one string attribute / varchar column `body` (size actly in the form:\n  ```json\n  {\"databaseId\":\"cli-\u003cZEALT_RUN_ID\u003e\",\"collectionId\":\"notes-\u003cZEALT_RUN_ID\u003e\"}\n  ```\n  where `\u003cZEALT_RUN_ID\u003e` is substituted with the actual run id.\n- The script exits with status 0.\n\n"])</script><script>self.__next_f.push([1,"b:Tcfb,"])</script><script>self.__next_f.push([1,"# Appwrite Storage: Create a Secure Uploads Bucket\n\n## Background\nAppwrite Storage organizes files into buckets. Each bucket can enforce file size limits, allowed extensions, compression, encryption, virus scanning, and per-file or per-bucket permissions. Your team needs a hardened bucket called `secure-uploads` that only authenticated users can access, with a strict size/extension policy and storage-side protections enabled.\n\nYou will write a Node.js script (using the official `node-appwrite` Server SDK) that creates this bucket against a real Appwrite project. The Appwrite endpoint, project ID, and API key are provided via environment variables.\n\n## Requirements\n- Create a new Storage bucket using `storage.createBucket` with all of the following settings:\n  - `permissions`: grant read AND write access to any signed-in user (use `Role.users()`).\n  - `fileSecurity`: `true` (per-file permissions enabled).\n  - `maximumFileSize`: `5242880` bytes (exactly 5 MiB).\n  - `allowedFileExtensions`: `[\"jpg\", \"jpeg\", \"png\", \"webp\"]` (order does not matter; values must be exactly these four).\n  - `compression`: `\"gzip\"`.\n  - `encryption`: `true`.\n  - `antivirus`: `true`.\n- Use the bucket name `secure-uploads-${run-id}` (see `run-id` rules below). The bucket display name and the bucket ID must both incorporate the `run-id` suffix.\n- After creation, print the newly created bucket's ID to standard output as the LAST non-empty line, in the format: `BUCKET_ID: \u003cbucket_id\u003e`.\n\n## Implementation Hints\n- Install/use the `node-appwrite` Server SDK. The SDK exposes `Client`, `Storage`, `ID`, `Permission`, and Token()`.\n- Read the Appwrite endpoint, project ID, and run ID from environment variables (`APPWRITE_ENDPOINT`, `APPWRITE_PROJECT_ID`, `ZEALT_RUN_ID`).\n- Construct a unique email address using the `ZEALT_RUN_ID` environment variable (e.g., `test-user-${process.env.ZEALT_RUN_ID}@example.com`).\n- Use Appwrite's `ID.unique()` helper to generate the `userId` argument. Do **NOT** hardcode the user ID.\n- Use `http://localhost:3000/auth/callback` as the redirect URL passed to `createMagicURLToken`.\n- After the call succeeds, print **only** the returned token's `userId` value to stdout, on its own line, with no extra prefix.\n- Exit with status `0` on success and a non-zero status on failure.\n\n## Implementation Hints\n- Install dependencies with npm and use the `appwrite` package (the client-web SDK) for the `Client`, `Account`, and `ID` exports. The `node-appwrite` server SDK is also present in the environment for verification, but the task itself should use the client SDK.\n- Configure the `Client` with `.setEndpoint(...)` and `.setProject(...)` using the values from the environment.\n- The third argument to `createMagicURLToken` is the redirect `url`; Appwrite will append `userId` and `secret` query parameters to it when sending the magic link.\n- Keep the script idempotent: each run sends a fresh magic-URL email for the configured address. Appwrite handles existing accounts automatically — when the email already exists, the supplied `userId` is ignored.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Command: `node send_magic_url.js`\n- Reads the Appwrite endpoint from `APPWRITE_ENDPOINT`, the project ID from `APPWRITE_PROJECT_ID`, and the run ID from `ZEALT_RUN_ID`.\n- The script must use the `appwrite` (client-web) SDK's `account.createMagicURLToken()` method with the redirect URL `http://localhost:3000/auth/callback`.\n- The first positional argument passed to `createMagicURLToken` must be produced by `ID.unique()` (no hardcoded user IDs).\n- Stdout: prints the token's returned `userId` string (a non-empty Appwrite user ID) on its own line.\n- Exit code: `0` on success.\n- After running the script, the Appwrite project must contain a user account with the email address generated using `ZEALT_RUN_ID` (created automatically by Appwrite on first magic-URL request if it does not already exist).\n\n"])</script><script>self.__next_f.push([1,"18:Td32,"])</script><script>self.__next_f.push([1,"# Server-Side OAuth2 Token Exchange with Appwrite\n\n## Background\nWhen integrating Appwrite with an OAuth2 provider (Google, GitHub, etc.), the typical flow is: the user logs in through the provider, Appwrite redirects back to your backend with a `userId` and a one-time `secret`, and your code must exchange that pair for an actual Appwrite session. The same two-parameter exchange pattern is used by every token-based login flow in Appwrite (Magic URL, Phone OTP, Email OTP, OAuth2).\n\nIn this task you will write the client-side exchange step. The environment has been pre-seeded as if the OAuth2 redirect (or any other token-issuing flow) just happened: a real Appwrite user has been created via the server SDK, and a one-time token has been issued for that user using `users.createToken(userId)`. The resulting `userId` and `secret` have been written to a JSON file on disk. Your job is to read them and exchange them for a real session using the **client-web** `appwrite` SDK, then look up the authenticated user.\n\n## Requirements\n- Implement a Node.js script at `/home/user/myproject/index.js` that uses the `appwrite` (client-web) SDK.\n- Read the Appwrite endpoint and project ID from environment variables `APPWRITE_ENDPOINT` and `APPWRITE_PROJECT_ID`.\n- Read the pre-seeded `userId` and `secret` from `/home/user/myproject/.seed.json` (a JSON file with keys `userId` and `secret`).\n- Exchange the token for a session by calling `account.createSession(userId, secret)`.\n- After the session is created, call `account.get()` to retrieve the now-authenticated user profile.\n- Print a single JSON object on the **last** stdout line with exactly these keys: `sessionId`, `userId`, `email` (corresponding to the session's `$id`, the user's `$id`, and the user's `email`).\n- Exit with status `0` on success and a non-zero status on failure.\n\n## Implementation Hints\n- Use the **client-web** `appwrite` package (not `node-appwrite`). Construct a `Client`, set the endpoint and project, then build an `Account`.\n- The `account.createSession(userId, secret)` call is the token-to-session exchange and is the same call shared by OAuth2, Magic URL, Phone OTP, and Email OTP flows.\n- After `createSession` succeeds the same `Client` instance is authenticated for subsequent calls, so `account.get()` will return the user belonging to that new session.\n- Make sure the JSON object is the **last** line printed on stdout (the verifier reads the last non-empty line and parses it as JSON).\n- Do **not** create the user or issue the token yourself — those steps are already performed by the environment's initial-state setup.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Command: `node index.js`\n- Reads the Appwrite endpoint from `APPWRITE_ENDPOINT` and the project ID from `APPWRITE_PROJECT_ID`.\n- Reads the seeded credentials from `/home/user/myproject/.seed.json` (keys: `userId`, `secret`).\n- Calls the client-web `account.createSession(userId, secret)` to exchange the token for a session.\n- Calls `account.get()` to fetch the authenticated user.\n- Stdout: the last non-empty line is a JSON object with the shape `{\"sessionId\": \"\u003csession_$id\u003e\", \"userId\": \"\u003cuser_$id\u003e\", \"email\": \"\u003cuser_email\u003e\"}`.\n- Exit code: `0` on success.\n- Side effect: a new Appwrite session must exist for the seeded user (verifiable via `users.listSessions(userId)` from the server SDK).\n\n"])</script><script>self.__next_f.push([1,"19:Tbd8,"])</script><script>self.__next_f.push([1,"# Appwrite Phone OTP Token Creation (Web SDK)\n\n## Background\nAppwrite supports passwordless authentication by issuing short-lived tokens delivered through SMS via the `createPhoneToken` endpoint of the Account service. In this task you will use the Appwrite Web SDK (`appwrite`) from a Node.js script to initiate a phone OTP flow by creating a new phone token. Appwrite will provision an anonymous user identified by the userId you provide and dispatch an OTP code through the configured SMS provider. Your job is to perform the token creation and surface the resulting userId so the rest of the authentication flow can later verify the OTP and create a session.\n\n## Requirements\n- Implement a Node.js script at `/home/user/myproject/index.js` that:\n  - Imports `Client`, `Account`, and `ID` from the `appwrite` package.\n  - Configures the SDK `Client` using `APPWRITE_ENDPOINT` and `APPWRITE_PROJECT_ID` from the environment.\n  - Calls `account.createPhoneToken` to start a phone OTP flow using a newly generated user id and a generated test phone number.\n  - The test phone number must be constructed from the `ZEALT_RUN_ID` environment variable: extract all digits from `ZEALT_RUN_ID`, pad the end with `0`s if there are fewer than 10 digits, take exactly the first 10 digits, and prepend `+1`. (e.g., if `ZEALT_RUN_ID` is `123a-45`, the digits are `12345`, padded to `1234500000`, resulting in `+11234500000`).\n  - Prints the resulting `userId` so that automated verification can pick it up.\n- Use `ID.unique()` to generate the userId; do NOT hardcode or reuse an existing user id.\n- Do NOT call `createSession`, `updatePhoneSession`, or any session-creation endpoint; the task scope is limited to creating the phone OTP token.\n\n## Implementation Hints\n- The `appwrite` Web SDK is already installed in `/home/user/myproject`.\n- The `Client` needs both `setEndpoint(...)` and `setProject(...)` calls before constructing an `Account` instance.\n- `createPhoneToken` is an async function that returns a `Token` object whose `userId` field is the new user's id.\n- Read all configuration from environment variables rather than embedding secrets in the source.\n- The verifier will execute the script and parse the last non-empty line of stdout, so make sure the userId is printed as the final piece of stdout output (no extra trailing logs or banners after it).\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Command: node /home/user/myproject/index.js\n- The script reads `APPWRITE_ENDPOINT`, `APPWRITE_PROJECT_ID`, and `ZEALT_RUN_ID` from environment variables.\n- The script uses the `appwrite` Web SDK (NOT `node-appwrite`) and calls `account.createPhoneToken(ID.unique(), \u003cphone\u003e)`.\n- The last non-empty line of stdout is the Appwrite userId, matching the regex `^[a-zA-Z0-9_\\-\\.]{1,36}$`.\n- After execution, the Appwrite project contains a user identified by that userId whose `phone` field equals the constructed phone number.\n- No Appwrite session is created by the script (the task only creates the OTP token).\n\n"])</script><script>self.__next_f.push([1,"1a:Tdab,"])</script><script>self.__next_f.push([1,"# Appwrite Realtime Document Subscription\n\n## Background\nYou are building a small Node.js script that subscribes to Appwrite Realtime and reacts to document creation events on a specific collection. The Appwrite project is already provisioned, and a database and a `messages` collection have been pre-created in the task environment for you.\n\nCredentials and configuration are provided via the following environment variables:\n- `APPWRITE_ENDPOINT` (e.g. `https://\u003cregion\u003e.cloud.appwrite.io/v1`)\n- `APPWRITE_PROJECT_ID`\n- `APPWRITE_API_KEY` (server API key used only for the pre-provisioned setup; the realtime client does NOT need it)\n- `ZEALT_RUN_ID` (a safe `zr-...` suffix; the pre-provisioned database id is `rt_${ZEALT_RUN_ID}`)\n\n## Requirements\n1. Implement a Node.js program at `/home/user/myproject/index.js` that:\n   - Uses the `appwrite` (web/client) SDK to subscribe to the Realtime channel for documents in the `messages` collection of the database `rt_${ZEALT_RUN_ID}`.\n   - Configures the `Client` with the endpoint (`APPWRITE_ENDPOINT`) and project id (`APPWRITE_PROJECT_ID`).\n   - Subscribes to the channel `databases.rt_${ZEALT_RUN_ID}.collections.messages.documents`.\n   - When a realtime response is received whose `events` array contains an entry matching `*.documents.*.create` (i.e. a document creation event for this collection), writes the document payload as a single JSON line to stdout using `JSON.stringify(response.payload)` and exits with status code `0`.\n   - If no matching event arrives within `30` seconds of starting, exits with a non-zero status code.\n2. Running `node index.js` from `/home/user/myproject` must execute the program.\n\n## Implementation Hints\n- The `appwrite` package is the client/web SDK and expects a browser `WebSocket` global. In Node.js you can polyfill it with the `ws` package (already installed) by assigning `globalThis.WebSocket ||= require('ws')` before constructing the client.\n- Build the channel string from `ZEALT_RUN_ID` and pass it directly to `client.subscribe(channel, callback)`.\n- The callback receives an object with `events` (an array of event strings like `databases.\u003cdb\u003e.collections.\u003ccol\u003e.documents.\u003cdoc\u003e.create`) and a `payload` (the document body).\n- Use `String.prototype.match` against the pattern `*.documents.*.create` (converted to a regex) or `events.some(e =\u003e /\\\\.documents\\\\..*\\\\.create$/.test(e))` to detect creation events.\n- Make sure the process actually exits with `process.exit(0)` after printing the payload, and `process.exit(1)` (or similar non-zero) after the 30s timeout.\n- Realtime docs:\n  - https://appwrite.io/docs/apis/realtime\n  - https://appwrite.io/docs/products/databases/realtime\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Script entry point: /home/user/myproject/index.js (run with `node index.js`)\n- The program subscribes to channel `databases.rt_${ZEALT_RUN_ID}.collections.messages.documents` where `ZEALT_RUN_ID` is read from the environment.\n- When a document is created in the pre-existing collection `messages` of database `rt_${ZEALT_RUN_ID}`, the program:\n  - Writes `JSON.stringify(response.payload)` as the final line of stdout.\n  - Exits with status code `0` within a few seconds of receiving the event.\n- If no document is created within 30 seconds, the program exits with a non-zero status code.\n- The program uses the `appwrite` client SDK's realtime subscription API (no direct REST polling, no `node-appwrite` server SDK for the subscription itself).\n\n"])</script><script>self.__next_f.push([1,"1b:Ta77,"])</script><script>self.__next_f.push([1,"# Create a Team, a User, and Add the User as a Member with Appwrite\n\n## Background\nAppwrite's Teams service models organizations and workspaces. A team is created with `teams.create(teamId, name)`, real user accounts are provisioned via the Users service (`users.create(...)`), and the two are linked via `teams.createMembership(teamId, roles, ...)`.\n\nWhen the server-side `node-appwrite` SDK calls `createMembership` with a `userId` and **no** `url`, the user is **directly added** to the team without an invitation email. This is the flow you must implement.\n\n## Requirements\n- Implement a Node.js CLI script at `/home/user/myproject/index.js` using the `node-appwrite` server SDK only.\n- Read `APPWRITE_ENDPOINT`, `APPWRITE_PROJECT_ID`, `APPWRITE_API_KEY`, and `ZEALT_RUN_ID` from the environment.\n- **Step 1 – Create a team** named `Engineering-${ZEALT_RUN_ID}` via `teams.create(ID.unique(), name)`.\n- **Step 2 – Create a user** via `users.create(ID.unique(), 'member-${ZEALT_RUN_ID}@example.com', undefined, 'TempPassw0rd!')`.\n- **Step 3 – Create a membership** that directly adds the user to the team. The server-side signature is `teams.createMembership(teamId, roles, email?, userId?, phone?, url?, name?)`. Pass `roles=['member']`, `userId=user.$id`, leave `url` undefined to skip the email-confirmation flow, and provide `name='Member ${ZEALT_RUN_ID}'`.\n- **Step 4 – Output:** Print exactly one JSON object as the **last non-empty stdout line**: `{\"teamId\":\"...\",\"userId\":\"...\",\"membershipId\":\"...\"}`.\n- Exit code `0` on success.\n\n## Implementation Hints\n- The `node-appwrite` SDK is already installed in `/home/user/myproject/node_modules`.\n- Build a single `Client` with `.setEndpoint(...).setProject(...).setKey(API_KEY)` and pass it to both `new Teams(client)` and `new Users(client)`.\n- Consult https://appwrite.io/docs/references/cloud/server-nodejs/teams#createMembership for the exact parameter ordering.\n- Log diagnostics to `stderr` so they do not pollute the last stdout line that the verifier parses.\n\n## Acceptance Criteria\n- Project path: `/home/user/myproject`.\n- Command: `node /home/user/myproject/index.js`.\n- Exit code: `0`.\n- Stdout: last non-empty line parses as JSON with string keys `teamId`, `userId`, `membershipId` (all non-empty alphanumeric IDs of at least 8 characters).\n- Side effects (verified via the Python admin SDK):\n  - A team with `$id == teamId` exists and its `name` equals `Engineering-${ZEALT_RUN_ID}`.\n  - A user with `$id == userId` exists and its email equals `member-${ZEALT_RUN_ID}@example.com`.\n  - A membership with `$id == membershipId` exists on the team, references that user, and contains the role `member`.\n"])</script><script>self.__next_f.push([1,"1c:T94a,"])</script><script>self.__next_f.push([1,"# Assign Role-Based Access Labels to an Appwrite User\n\n## Background\nAppwrite supports server-side **labels** on user accounts. Labels are arbitrary string tags that you can attach to a user via `Users.updateLabels(userId, labels)` and then reference inside permission strings (e.g. `Role.label('admin')`) to drive role-based access control. Labels are only mutable from server contexts that hold an API key — they are not exposed via the client account API for self-modification.\n\nA user account has already been provisioned for you. Your job is to attach two labels — `admin` and `moderator` — to that user, then print the updated label set to stdout.\n\n## Requirements\n- Implement a Node.js CLI script at `/home/user/myproject/index.js`.\n- Read the seeded `userId` from the JSON file `/home/user/myproject/.seed.json` (key `userId`).\n- Read `APPWRITE_ENDPOINT`, `APPWRITE_PROJECT_ID`, and `APPWRITE_API_KEY` from the environment.\n- Build a `node-appwrite` `Client` configured with `.setEndpoint(...).setProject(...).setKey(API_KEY)` and instantiate `new Users(client)`.\n- Call `users.updateLabels(userId, ['admin', 'moderator'])`.\n- Print the returned user's `labels` array as a compact JSON array (e.g. `[\"admin\",\"moderator\"]`) on the **last non-empty stdout line**.\n- Constraint: you **must** use `users.updateLabels(...)`. Do not attempt to attach labels by writing to the document store, by using Teams, or by sending raw REST requests.\n- Exit code `0` on success.\n\n## Implementation Hints\n- `node-appwrite` is pre-installed under `/home/user/myproject/node_modules`.\n- The Users service is exported from `node-appwrite`: `const { Client, Users } = require('node-appwrite');`.\n- The order of labels in the printed array does not matter as long as both `admin` and `moderator` are present and no other labels are added.\n- The `.seed.json` file is created by the initial-state fixture and looks like `{\"userId\":\"...\",\"email\":\"labels-user-\u003crun-id\u003e@example.com\"}`.\n\n## Acceptance Criteria\n- Project path: `/home/user/myproject`.\n- Command: `node /home/user/myproject/index.js`.\n- Exit code: `0`.\n- Stdout: the last non-empty line is a JSON array containing exactly the strings `admin` and `moderator` (in any order, no duplicates, no extra entries).\n- Side effect (verified via the Pytho
